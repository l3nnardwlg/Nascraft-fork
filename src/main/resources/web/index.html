<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nascraft Fork Market</title>
    <link rel="icon" type="image/png" href="/api/icons/logo-color.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col sm:flex-row bg-gray-900 text-gray-100">
    <aside class="w-full sm:w-64 bg-gradient-to-b from-gray-900 to-black p-4 flex flex-col shrink-0 border-b sm:border-b-0 sm:border-r border-gray-700 lg:h-screen">
        <div class="flex items-center justify-between mb-4 border-b border-gray-700/50 pb-4">
            <div class="flex items-center gap-2 min-w-0">
                <img src="/api/icons/logo-color.png" alt="Nascraft Fork" class="w-6 h-6 shrink-0">
                <div class="min-w-0 leading-tight">
                    <div class="font-bold text-white text-base tracking-wider truncate">Nascraft Fork</div>
                    <div class="text-[10px] uppercase tracking-[0.16em] text-gray-500">by AGF Studios</div>
                </div>
            </div>
            <div id="auth-controls" class="shrink-0">
                <button id="login-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-1.5 px-3 rounded-md transition duration-150 ease-in-out">Login</button>
            </div>
        </div>

        <div id="nav-tabs" class="flex border-b border-gray-800 mb-4 text-xs font-semibold gap-1">
            <button id="tab-market" class="flex-1 pb-2 border-b-2 border-indigo-500 text-white text-center">Market</button>
            <button id="tab-portfolio" class="flex-1 pb-2 border-b-2 border-transparent text-gray-500 hover:text-gray-300 text-center hidden">Portfolio</button>
        </div>

        <div class="mb-4 relative">
            <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
            </span>
            <input type="text" id="search-input" placeholder="Search Items..." class="w-full pl-8 pr-3 py-2 bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-100 placeholder-gray-500 text-sm">
        </div>

        <div class="mb-2 text-xs text-gray-400">Sort by:</div>
        <div id="sort-controls" class="flex flex-wrap gap-2 mb-3 text-xs">
            <button class="sort-button" data-sort-category="price">Price <span class="sort-indicator"></span></button>
            <button class="sort-button" data-sort-category="change">Change <span class="sort-indicator"></span></button>
            <button class="sort-button" data-sort-category="operations">Popular <span class="sort-indicator"></span></button>
        </div>

        <nav class="flex-1 overflow-y-auto custom-scrollbar -mr-1 pr-1 h-40 sm:h-auto">
            <ul id="item-list" class="space-y-1"><li class="p-2 text-gray-400">Loading items...</li></ul>
        </nav>
        <div class="mt-4 pt-4 border-t border-gray-700/50 text-xs text-gray-500">
            <div class="flex items-center justify-between gap-2">
                <span>Nascraft Fork</span>
                <a href="https://agf-studios.com" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-400 transition-colors duration-150">AGF Studios</a>
            </div>
            <div class="mt-1 text-[10px] text-gray-600">Development build · release candidate preparation</div>
        </div>
    </aside>

    <main class="flex-1 p-4 sm:p-6 flex flex-col gap-4 sm:gap-6 bg-gray-900 overflow-y-auto h-auto sm:h-screen">
        <div id="market-view" class="flex flex-col gap-4 sm:gap-6 flex-1">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
                <section id="chart-section" class="lg:col-span-2 bg-gradient-to-br from-gray-700 to-gray-800 p-4 rounded-lg shadow-xl flex flex-col">
                    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between mb-1">
                        <div class="flex items-center mb-2 sm:mb-0">
                            <img id="selected-item-icon" src="https://placehold.co/32x32/1f2937/9ca3af?text=?" alt="Item Icon" class="w-9 h-9 mr-3 rounded-md shadow flex-shrink-0">
                            <div>
                                <h2 id="selected-item-name" class="text-xl sm:text-2xl font-semibold text-white">Select an Item</h2>
                                <p id="selected-item-description" class="text-sm text-gray-400 mt-0.5">Select an item to see its price evolution.</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-start sm:items-end space-y-1 flex-shrink-0 mt-2 sm:mt-0 sm:ml-4">
                            <div class="flex items-center justify-start sm:justify-end">
                                <label for="inflation-adjust-checkbox" class="chart-option-label">Adjust for Inflation</label>
                                <input type="checkbox" id="inflation-adjust-checkbox" class="chart-option-checkbox">
                            </div>
                            <div class="flex items-center justify-start sm:justify-end">
                                <label for="log-scale-checkbox" class="chart-option-label">Log Scale</label>
                                <input type="checkbox" id="log-scale-checkbox" class="chart-option-checkbox">
                            </div>
                        </div>
                    </div>
                    <div id="item-price-chart-container" class="chart-container min-h-[280px]"></div>
                </section>
                <section class="bg-gradient-to-br from-gray-700 to-gray-800 p-4 rounded-lg shadow-xl flex flex-col">
                    <div id="selected-item-details" class="text-sm text-gray-300"></div>
                </section>
            </div>
            <div id="secondary-content" class="grid grid-cols-1 xl:grid-cols-2 gap-4 sm:gap-6 flex-1 min-h-0">
                <section class="bg-gray-800 rounded-lg shadow-xl p-4 overflow-hidden"><div id="treemap-container"></div><div id="treemap-tooltip"></div></section>
                <section class="bg-gray-800 rounded-lg shadow-xl p-4 overflow-y-auto custom-scrollbar"><div id="market-stats"></div><div id="portfolio-view" class="hidden"></div></section>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="production-hardening.js"></script>
</body>
</html>
